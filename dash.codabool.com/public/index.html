<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodaBool's Dashboard</title>
<meta name="description" content="Self host dashboard for CodaBool">
<link rel="icon" href="/icon.jpg">
<style>
html,body{margin:0;background-color:rgba(0,0,0,0)}
body{font-family:system-ui,sans-serif}
.bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:-1}
.flex-container{display:flex;justify-content:center;gap:20px;flex-wrap:wrap;max-width:1400px;margin:40px auto 0 auto}
.flex-item{display:flex;justify-content:center;align-items:center;border-radius:10px;background-color:rgba(146,135,135,.15);width:150px;height:150px;margin:.2em;cursor:pointer;position:relative;overflow:hidden}
.flex-item:hover{background-color:rgba(146,135,135,.4)}
.flex-item img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.time-link{text-decoration:none}
.time{color:#fff;margin:10px auto 0 auto;text-align:center;width:300px;height:1.2em;font-size:4em;text-shadow:0 0 5px #000;opacity:.7;cursor:default}
@media (max-width:960px){.flex-item{width:120px;height:120px;margin:.1em}.flex-container{gap:5px}}
@media (max-width:544px){.flex-item{width:90px;height:90px;margin:.1em}}
@keyframes bounce{0%,20%,50%,80%,100%{transform:translateY(0)}40%{transform:translateY(-4px)}60%{transform:translateY(-2px)}}
.bounce{animation:bounce 1s infinite}
</style>
</head>
<body>
<img class="bg" src="/background.webp" alt="background" fetchpriority="high">
<a class="time-link" id="toggle" href="/?l"><h1 class="time" id="time"></h1></a>
<div class="flex-container" id="sites"></div>
<script>
const localSites = {
  'http://192.168.0.25:8096': '/jellyfin.webp',
  'https://ssh.codabool.com': '/ssh.webp',
  'http://192.168.0.25:8085': '/rss.webp',
  'https://bin.codabool.com': '/bin.webp',
  'http://192.168.0.25:3080': '/librechat.webp',
  // 'http://192.168.0.25:7075': '/doc.webp',
  'http://192.168.0.25:30000': '/d20.webp',
  'http://192.168.0.25:30001': '/d20.webp',
  'http://192.168.0.25:8675': '/upvote.webp',
  'http://192.168.0.25:5000': '/changedetect.webp',
  'http://192.168.0.25:1200': '/rsshub.webp',
  'http://192.168.0.25:2283/albums': '/immich.webp',
  // 'https://money.codabool.com': '/money.webp',
  'http://192.168.0.25:3001': '/uptime.webp',
  'http://192.168.0.25:8082': '/tools.webp',
  'http://192.168.0.25:8384': '/sync.webp',
}

const remoteSites = {
  'https://media.codabool.com': '/jellyfin.webp',
  'https://ssh.codabool.com': '/ssh.webp',
  'https://rss.codabool.com': '/rss.webp',
  'https://bin.codabool.com': '/bin.webp',
  // 'https://doc.codabool.com': '/doc.webp',
  'https://rpg.codabool.com': '/d20.webp',
  // 'https://upvote.codabool.com': '/upvote.webp',
  'https://photos.codabool.com': '/immich.webp',
  // 'https://money.codabool.com': '/money.webp',
  'https://uptime.codabool.com': '/uptime.webp',
  'https://tools.codabool.com': '/tools.webp',
}

// 🌅 ☀️ ⛅ 🌤️ 🌇 🌄 🌕 🌑 ⛅ 🌙 🌗
function getEmoji() {
  const hour = Number(new Date().toLocaleString('en-US', { timeZone: 'America/New_York', hour: 'numeric', hourCycle: 'h23' }))
  if (hour <= 3) return '🌑'
  if (hour <= 6) return '🌗'
  if (hour <= 9) return '🌅'
  if (hour <= 12) return '⛅'
  if (hour <= 15) return '☀️'
  if (hour <= 18) return '🌤️'
  if (hour <= 21) return '🌄'
  return '🌙'
}

const useLocalIp = new URLSearchParams(location.search).has('l')
const time = document.getElementById('time')
time.textContent = getEmoji()
if (useLocalIp) {
  time.classList.add('bounce')
  document.getElementById('toggle').href = '/'
}
document.getElementById('sites').innerHTML = Object.entries(useLocalIp ? localSites : remoteSites).map(([href, img]) =>
  `<div class="flex-item"><a href="${href}"><img src="${img}" alt="${href}"><span style="display:none">${href}</span></a></div>`
).join('')
</script>
</body>
</html>
